<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Product</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/AdminLTE.min.css}">
    <link rel="stylesheet" th:href="@{/css/_all-skins.min.css}">
    <link rel="stylesheet" th:href="@{/css/product_detail.css}">
</head>
<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">

    <header th:replace="~{fragment/header :: header}"></header>
    <div th:replace="~{fragment/sidebar :: sidebar}"></div>

    <div class="content-wrapper">
        <section class="content-header">
            <h1 th:text="#{product.updateTitle}">Cập nhật sản phẩm</h1>
        </section>

        <section class="content">

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <!-- Update thông tin sản phẩm -->
            <div class="box box-warning">
                <div class="box-header with-border">
                    <h3 class="box-title" th:text="#{product.updateInfoTitle}">Cập nhật thông tin sản phẩm</h3>
                </div>
                <div class="box-body">
                    <form th:action="@{|/admin/products/update/info/${product.id}|}" th:object="${product}" method="post">
                        <input type="hidden" name="_method" value="PATCH">
                        <!-- Tên sản phẩm -->
                        <div class="form-group">
                            <label>Tên sản phẩm</label>
                            <input type="text" class="form-control" th:field="*{name}" th:value="${product.name}">
                            <p class="text-danger" th:if="${fieldErrors != null and fieldErrors.containsKey('name')}"
                               th:text="${fieldErrors['name']}"></p>
                        </div>

                        <!-- Mô tả -->
                        <div class="form-group">
                            <label>Mô tả</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" th:text="${product.description}"></textarea>
                            <p class="text-danger" th:if="${fieldErrors != null and fieldErrors.containsKey('description')}"
                               th:text="${fieldErrors['description']}"></p>
                        </div>

                        <!-- Giá nhập -->
                        <div class="form-group">
                            <label>Giá nhập</label>
                            <input type="number" class="form-control" th:field="*{importPrice}" th:value="${product.importPrice}">
                            <p class="text-danger" th:if="${fieldErrors != null and fieldErrors.containsKey('importPrice')}"
                               th:text="${fieldErrors['importPrice']}"></p>
                        </div>

                        <!-- Giá bán -->
                        <div class="form-group">
                            <label>Giá bán</label>
                            <input type="number" class="form-control" th:field="*{sellingPrice}" th:value="${product.sellingPrice}">
                            <p class="text-danger" th:if="${fieldErrors != null and fieldErrors.containsKey('sellingPrice')}"
                               th:text="${fieldErrors['sellingPrice']}"></p>
                        </div>

                        <!-- Số lượng tồn -->
                        <div class="form-group">
                            <label>Số lượng tồn</label>
                            <input type="number" class="form-control" th:field="*{stockQuantity}" th:value="${product.stockQuantity}">
                            <p class="text-danger" th:if="${fieldErrors != null and fieldErrors.containsKey('stockQuantity')}"
                               th:text="${fieldErrors['stockQuantity']}"></p>
                        </div>

                        <div class="form-group">
                            <label>Danh mục</label>
                            <select class="form-control" th:field="*{categoryId}">
                                <option value="" disabled>-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${cat.id == product.categoryId}">
                                </option>
                            </select>
                            <p class="text-danger" th:if="${fieldErrors != null and fieldErrors.containsKey('categoryId')}"
                               th:text="${fieldErrors['categoryId']}"></p>
                        </div>


                        <!-- Checkbox nổi bật / đã ẩn -->
                        <div class="form-group">
                            <label>
                                <input type="checkbox" name="isFeatured" th:value="true" th:checked="${product.isFeatured}"/>
                                Nổi bật
                            </label>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" name="isDeleted" th:value="true" th:checked="${product.isDeleted}"/>
                                Đã ẩn
                            </label>
                        </div>

                        <div class="box-footer">
                            <button type="submit" class="btn btn-success">Cập nhật thông tin</button>
                            <a th:href="@{|/admin/products/detail/${product.id}|}" class="btn btn-default">Hủy</a>
                        </div>
                    </form>

                </div>
            </div>

            <!-- Box 2: Update hình ảnh sản phẩm -->
            <div class="box box-info">
                <div class="box-header with-border">
                    <h3 class="box-title" th:text="#{product.updateImagesTitle}">Cập nhật hình ảnh sản phẩm</h3>
                </div>
                <div class="box-body">
                    <form th:action="@{|/admin/products/update/img/${product.id}|}" th:object="${product}" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="_method" value="PATCH">
                        <input type="hidden" th:name="id" th:value="${product.id}"/>

                        <div class="form-group">
                            <label th:text="#{product.uploadImages}">Upload ảnh mới</label>
                            <input type="file" name="images" multiple class="form-control">
                        </div>

                        <div class="form-group">
                            <label th:text="#{product.currentImages}">Ảnh hiện tại</label>
                            <div class="images-container" style="margin-top:10px;">
                                <img th:each="img : ${product.imageUrls}" th:src="@{${img}}" class="product-img" style="width:100px;height:auto;margin-right:5px;" alt="Product Image"/>
                            </div>
                        </div>

                        <div class="box-footer">
                            <button type="submit" class="btn btn-warning" th:text="#{product.updateImagesBtn}">Cập nhật hình ảnh</button>
                            <a th:href="@{|/admin/products/detail/${product.id}|}" class="btn btn-default" th:text="#{product.cancelBtn}">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>

        </section>
    </div>

</div>

<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/adminlte.min.js}"></script>
</body>
</html>
